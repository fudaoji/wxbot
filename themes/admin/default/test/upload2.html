<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Layui多图多视频上传插件</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.staticfile.org/layui/2.8.18/css/layui.min.css">
    <style>
        /* 上传组件样式 */
        .layui-upload-form {
            display: inline-block;
            width: 100%;
        }

        .layui-upload-form .layui-upload-box {
            position: relative;
            min-height: 100px;
            border: 1px dashed #e6e6e6;
            border-radius: 2px;
            padding: 10px;
            background-color: #fbfbfb;
            transition: all 0.3s;
        }

        .layui-upload-form .layui-upload-box:hover {
            border-color: #1E9FFF;
        }

        .layui-upload-form .layui-upload-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .layui-upload-form .layui-upload-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 2px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }

        .layui-upload-form .layui-upload-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .layui-upload-form .layui-upload-item-video {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        .layui-upload-form .layui-upload-item-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .layui-upload-form .layui-upload-item-video .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .layui-upload-form .layui-upload-item-video:hover .play-icon {
            background-color: rgba(0,0,0,0.7);
        }

        .layui-upload-form .layui-upload-item-video .play-icon i {
            color: #fff;
            font-size: 16px;
            margin-left: 2px;
        }

        .layui-upload-form .layui-upload-item-file {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 5px;
            text-align: center;
        }

        .layui-upload-form .layui-upload-item-file i {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .layui-upload-form .layui-upload-item-file span {
            font-size: 12px;
            word-break: break-all;
        }

        .layui-upload-form .layui-upload-item-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background-color: rgba(0,0,0,.1);
        }

        .layui-upload-form .layui-upload-item-progress-bar {
            height: 100%;
            background-color: #1E9FFF;
            transition: width 0.3s;
        }

        .layui-upload-form .layui-upload-item-actions {
            position: absolute;
            top: 0;
            right: 0;
            opacity: 0;
            transition: opacity 0.3s;
            background-color: rgba(0,0,0,.5);
            padding: 2px;
            border-radius: 0 0 0 2px;
            z-index: 10;
        }

        .layui-upload-form .layui-upload-item:hover .layui-upload-item-actions {
            opacity: 1;
        }

        .layui-upload-form .layui-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            border: 1px dashed #e6e6e6;
            border-radius: 2px;
            background-color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .layui-upload-form .layui-upload-btn:hover {
            border-color: #1E9FFF;
            color: #1E9FFF;
        }

        .layui-upload-form .layui-upload-btn i {
            font-size: 24px;
        }

        .layui-upload-form .layui-upload-error {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,0,0,.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f00;
            font-size: 12px;
            z-index: 5;
        }

        .layui-upload-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* 视频预览弹窗样式 */
        .layui-video-preview {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .layui-video-preview video {
            max-width: 90%;
            max-height: 90%;
            background-color: #000;
        }

        .layui-video-preview .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .layui-video-preview .close-btn:hover {
            background-color: rgba(0,0,0,0.8);
        }

        .layui-video-preview .close-btn i {
            color: #fff;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="layui-container">
    <div class="layui-row">
        <div class="layui-col-md8 offset-md2">
            <h3 class="layui-mt20 layui-mb20">多图多视频上传示例</h3>

            <form class="layui-form" lay-filter="uploadForm">
                <div class="layui-form-item">
                    <label class="layui-form-label">存储类型</label>
                    <div class="layui-input-block">
                        <input type="radio" name="storageType" value="aliyun" title="阿里云OSS" checked>
                        <input type="radio" name="storageType" value="qiniu" title="七牛云">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">图片上传</label>
                    <div class="layui-input-block">
                        <div id="imageUpload" class="layui-upload-form"></div>
                        <div class="layui-form-mid layui-word-aux">支持多图上传，最大单文件10MB</div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">视频上传</label>
                    <div class="layui-input-block">
                        <div id="videoUpload" class="layui-upload-form"></div>
                        <div class="layui-form-mid layui-word-aux">支持多视频上传，最大单文件50MB</div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn" lay-submit lay-filter="submit">提交</button>
                        <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.staticfile.org/layui/2.8.18/layui.min.js"></script>

<script>
    layui.define(['layer', 'upload'], function(exports) {
        var $ = layui.jquery;
        var layer = layui.layer;
        var upload = layui.upload;

        // 存储类型枚举
        var STORAGE_TYPE = {
            ALIYUN: 'aliyun',
            QINIU: 'qiniu'
        };

        // 存储SDK加载状态
        var sdkLoaded = {
            aliyun: false,
            qiniu: false
        };

        // 存储SDK加载Promise
        var sdkPromises = {
            aliyun: null,
            qiniu: null
        };

        // 加载SDK文件
        function loadSdk(storageType, retryCount = 3) {
            if (sdkLoaded[storageType]) {
                return Promise.resolve();
            }

            if (sdkPromises[storageType]) {
                return sdkPromises[storageType];
            }

            // 为每个存储类型定义多个CDN备选地址
            const cdnOptions = {
                [STORAGE_TYPE.ALIYUN]: [
                    'https://gosspublic.alicdn.com/aliyun-oss-sdk-6.17.0.min.js',
                    'https://cdn.jsdelivr.net/npm/ali-oss@6.17.0/dist/aliyun-oss-sdk.min.js'
                ],
                [STORAGE_TYPE.QINIU]: [
                    'https://cdn.jsdelivr.net/npm/qiniu-js@3.16.0/dist/qiniu.min.js',
                    'https://unpkg.com/qiniu-js@3.16.0/dist/qiniu.min.js'
                ]
            };

            // 当前尝试的CDN索引
            let currentCdnIndex = 0;

            // 尝试加载函数
            function tryLoad() {
                const scriptUrl = cdnOptions[storageType][currentCdnIndex];

                return new Promise(function(resolve, reject) {
                    const script = document.createElement('script');
                    script.src = scriptUrl;

                    script.onload = function() {
                        // 验证SDK是否正确加载
                        if (storageType === STORAGE_TYPE.QINIU && typeof qiniu === 'undefined') {
                            script.onerror();
                            return;
                        }

                        if (storageType === STORAGE_TYPE.ALIYUN && typeof OSS === 'undefined') {
                            script.onerror();
                            return;
                        }

                        sdkLoaded[storageType] = true;
                        resolve();
                    };

                    script.onerror = function() {
                        if (currentCdnIndex < cdnOptions[storageType].length - 1) {
                            // 尝试下一个CDN
                            currentCdnIndex++;
                            tryLoad().then(resolve).catch(reject);
                        } else if (retryCount > 0) {
                            // 所有CDN都失败，尝试重试
                            setTimeout(() => {
                                currentCdnIndex = 0; // 重置CDN索引
                                tryLoad().then(resolve).catch(reject);
                            }, 1000);
                        } else {
                            reject(new Error(`Failed to load ${storageType} SDK from all CDNs`));
                        }
                    };

                    document.head.appendChild(script);
                });
            }

            sdkPromises[storageType] = tryLoad();
            return sdkPromises[storageType];
        }

        // 上传组件构造函数
        var UploadMulti = function(options) {
            this.options = $.extend(true, {
                elem: null,                 // 绑定元素
                storageType: STORAGE_TYPE.ALIYUN, // 默认存储类型
                maxCount: 10,               // 最大上传数量
                maxSize: 10,                // 最大文件大小(MB)
                accept: 'file',             // 接受的文件类型
                multiple: true,             // 是否允许多文件
                autoUpload: true,           // 是否自动上传
                uploadText: '点击上传',     // 上传按钮文本
                onSuccess: function(file, res) {}, // 上传成功回调
                onError: function(file, error) {}, // 上传失败回调
                onProgress: function(file, percent) {}, // 上传进度回调
                onChange: function(files) {} // 文件列表变化回调
            }, options);

            this.init();
        };

        // 初始化方法
        UploadMulti.prototype.init = function() {
            var that = this;
            var options = this.options;

            // 创建上传容器
            this.container = $(options.elem);
            this.createUploadBox();

            // 初始化上传实例
            this.uploadInst = upload.render({
                elem: this.uploadBtn[0],
                url: 'about:blank', // 禁用默认上传
                accept: options.accept,
                acceptMime: options.acceptMime,
                multiple: options.multiple,
                size: options.maxSize * 1024, // MB转KB
                auto: false,
                number: options.maxCount,
                choose: function(obj) {
                    var files = obj.pushFile(); // 获取选择的文件
                    that.handleFiles(obj, files);
                }
            });

            // 监听存储类型变更事件
            form.on('radio(storageType)', function(data) {
                options.storageType = data.value;
                that.loadStorageSdk().then(function() {
                    that.initStorageClient();
                    layer.msg(`已切换到${data.value === 'aliyun' ? '阿里云' : '七牛云'}存储`);
                });
            });

            // 初始加载当前选择的存储SDK
            this.loadStorageSdk().then(function() {
                that.initStorageClient();
            });
        };

        // 加载存储SDK
        UploadMulti.prototype.loadStorageSdk = function() {
            var that = this;
            var options = this.options;

            // 显示加载状态
            this.showLoading(`正在加载${options.storageType === 'aliyun' ? '阿里云' : '七牛云'}SDK...`);

            return loadSdk(options.storageType).then(function() {
                // 添加200ms延迟，确保SDK完全初始化
                return new Promise(function(resolve) {
                    setTimeout(resolve, 200);
                });
            }).then(function() {
                that.hideLoading();
                that.initStorageClient();
            }).catch(function(error) {
                that.hideLoading();

                // 显示详细的错误信息
                layer.open({
                    type: 0,
                    title: `加载${options.storageType === 'aliyun' ? '阿里云' : '七牛云'}SDK失败`,
                    content: `
              <p>错误信息: ${error.message}</p>
              <p>请检查以下事项:</p>
              <ol>
                <li>网络连接是否正常</li>
                <li>CDN资源是否可访问</li>
                <li>防火墙或代理设置是否阻止了资源加载</li>
                <li>尝试刷新页面或稍后再试</li>
              </ol>
            `,
                    icon: 2,
                    area: ['400px', 'auto'],
                    btn: ['确定'],
                    btnAlign: 'c'
                });

                // 输出详细的调试信息
                console.error(`加载${options.storageType} SDK失败:`, error);
            });
        };

        // 创建上传容器
        UploadMulti.prototype.createUploadBox = function() {
            var options = this.options;

            this.container.html(`
          <div class="layui-upload-box">
            <div class="layui-upload-loading layui-hide">
              <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i>
            </div>
            <div class="layui-upload-list" id="uploadList"></div>
            <div class="layui-upload-btn" id="uploadBtn">
              <i class="layui-icon layui-icon-upload-drag"></i>
              <div>${options.uploadText}</div>
            </div>
          </div>
        `);

            this.uploadList = this.container.find('#uploadList');
            this.uploadBtn = this.container.find('#uploadBtn');
            this.loading = this.container.find('.layui-upload-loading');
        };

        // 显示加载状态
        UploadMulti.prototype.showLoading = function(text) {
            this.loading.find('i').next().remove();
            if (text) {
                this.loading.find('i').after(`<div class="layui-mt5">${text}</div>`);
            }
            this.loading.removeClass('layui-hide');
        };

        // 隐藏加载状态
        UploadMulti.prototype.hideLoading = function() {
            this.loading.addClass('layui-hide');
        };

        // 初始化存储客户端
        UploadMulti.prototype.initStorageClient = function() {
            var options = this.options;

            switch(options.storageType) {
                case STORAGE_TYPE.ALIYUN:
                    this.storageClient = new OSS({
                        region: options.aliyun.region,
                        accessKeyId: options.aliyun.accessKeyId,
                        accessKeySecret: options.aliyun.accessKeySecret,
                        bucket: options.aliyun.bucket
                    });
                    break;

                case STORAGE_TYPE.QINIU:
                    // 验证七牛云SDK是否正确加载
                    if (typeof qiniu === 'undefined') {
                        throw new Error('七牛云SDK未正确加载');
                    }
                    break;
            }
        };

        // 处理选择的文件
        UploadMulti.prototype.handleFiles = function(obj, files) {
            var that = this;
            var options = this.options;

            // 检查文件数量是否超过限制
            var currentCount = this.uploadList.find('.layui-upload-item').length;
            var selectedCount = Object.keys(files).length;

            if (currentCount + selectedCount > options.maxCount) {
                layer.msg(`最多只能上传${options.maxCount}个文件`, {icon: 2});
                return;
            }

            // 预览文件
            obj.preview(function(index, file, result) {
                var fileItem = that.createFileItem(file, result);
                that.uploadList.append(fileItem);

                if (options.autoUpload) {
                    that.uploadFile(file, fileItem, index);
                }

                // 更新文件列表
                that.updateFileList();
            });
        };

        // 创建文件项
        UploadMulti.prototype.createFileItem = function(file, result) {
            var that = this;
            var isImage = file.type.indexOf('image') !== -1;
            var isVideo = file.type.indexOf('video') !== -1;
            var fileExt = file.name.split('.').pop().toLowerCase();

            // 获取文件图标
            var fileIcon = this.getFileIcon(fileExt);

            var fileItem = $(`
          <div class="layui-upload-item" data-name="${file.name}">
            ${isImage ? `<img src="${result}" alt="${file.name}">` :
                    isVideo ? `
                <div class="layui-upload-item-video">
                  <video controlsList="nodownload" poster="${this.getVideoPoster(result)}" preload="metadata">
                    <source src="${result}" type="${file.type}">
                    您的浏览器不支持视频播放
                  </video>
                  <div class="play-icon">
                    <i class="layui-icon layui-icon-play"></i>
                  </div>
                </div>
              ` :
                            `<div class="layui-upload-item-file">
                <i class="layui-icon ${fileIcon}"></i>
                <span>${file.name}</span>
              </div>`}
            <div class="layui-upload-item-progress">
              <div class="layui-upload-item-progress-bar" style="width: 0%"></div>
            </div>
            <div class="layui-upload-item-actions">
              <button class="layui-btn layui-btn-xs layui-btn-danger layui-upload-delete">
                <i class="layui-icon layui-icon-delete"></i>
              </button>
              ${isVideo ? `
                <button class="layui-btn layui-btn-xs layui-btn-primary layui-upload-preview">
                  <i class="layui-icon layui-icon-video"></i>
                </button>
              ` : ''}
            </div>
          </div>
        `);

            // 绑定删除事件
            fileItem.find('.layui-upload-delete').on('click', function() {
                fileItem.remove();
                that.updateFileList();
            });

            // 绑定视频预览事件
            if (isVideo) {
                fileItem.find('.layui-upload-preview, .play-icon').on('click', function(e) {
                    e.stopPropagation();
                    that.previewVideo(file, result);
                });

                // 视频播放控制
                const video = fileItem.find('video')[0];
                fileItem.find('.play-icon').on('click', function() {
                    if (video.paused) {
                        video.play();
                        $(this).hide();
                    } else {
                        video.pause();
                        $(this).show();
                    }
                });

                video.addEventListener('play', function() {
                    fileItem.find('.play-icon').hide();
                });

                video.addEventListener('pause', function() {
                    fileItem.find('.play-icon').show();
                });
            }

            return fileItem;
        };

        // 获取文件图标
        UploadMulti.prototype.getFileIcon = function(ext) {
            const iconMap = {
                doc: 'layui-icon-file-word',
                docx: 'layui-icon-file-word',
                xls: 'layui-icon-file-excel',
                xlsx: 'layui-icon-file-excel',
                ppt: 'layui-icon-file-ppt',
                pptx: 'layui-icon-file-ppt',
                pdf: 'layui-icon-file-pdf',
                zip: 'layui-icon-file-zip',
                rar: 'layui-icon-file-zip',
                txt: 'layui-icon-file-text',
                mp3: 'layui-icon-music',
                default: 'layui-icon-file'
            };

            return iconMap[ext] || iconMap.default;
        };

        // 获取视频预览图
        UploadMulti.prototype.getVideoPoster = function(url) {
            // 实际项目中可以使用视频第一帧作为预览图
            // 这里使用默认预览图
            return 'https://picsum.photos/200/150?random=video';
        };

        // 预览视频
        UploadMulti.prototype.previewVideo = function(file, url) {
            // 创建视频预览弹窗
            const previewBox = $(`
          <div class="layui-video-preview">
            <video controls>
              <source src="${url}" type="${file.type}">
              您的浏览器不支持视频播放
            </video>
            <div class="close-btn">
              <i class="layui-icon layui-icon-close"></i>
            </div>
          </div>
        `);

            // 添加到页面
            $('body').append(previewBox);

            // 绑定关闭事件
            previewBox.find('.close-btn').on('click', function() {
                previewBox.remove();
            });

            // 点击空白区域关闭
            previewBox.on('click', function(e) {
                if (e.target === this) {
                    previewBox.remove();
                }
            });

            // 播放视频
            const video = previewBox.find('video')[0];
            video.play();
        };

        // 上传文件
        UploadMulti.prototype.uploadFile = function(file, fileItem, index) {
            var that = this;
            var options = this.options;
            var progressBar = fileItem.find('.layui-upload-item-progress-bar');

            // 生成文件名
            var fileName = this.generateFileName(file);

            // 检查存储客户端是否初始化
            if (!this.storageClient && options.storageType === STORAGE_TYPE.ALIYUN) {
                layer.msg('存储客户端未初始化', {icon: 2});
                return;
            }

            // 根据存储类型选择上传方式
            var uploadPromise;

            switch(options.storageType) {
                case STORAGE_TYPE.ALIYUN:
                    uploadPromise = this.storageClient.put(fileName, file, {
                        progress: function(p) {
                            var percent = Math.round(p * 100);
                            progressBar.width(percent + '%');
                            options.onProgress(file, percent);
                        }
                    });
                    break;

                case STORAGE_TYPE.QINIU:
                    uploadPromise = new Promise(function(resolve, reject) {
                        console.log('开始七牛云上传，SDK版本:', qiniu.version);

                        // 验证关键API是否存在
                        if (typeof qiniu.upload !== 'function') {
                            reject(new Error('七牛云SDK API不可用: qiniu.upload'));
                            return;
                        }

                        const config = {
                            useCdnDomain: true,
                            region: qiniu.region[options.qiniu.region || 'z0']
                        };

                        const observer = {
                            next: function(response) {
                                var percent = Math.round(response.total.percent);
                                progressBar.width(percent + '%');
                                options.onProgress(file, percent);
                            },
                            error: function(err) {
                                reject(err);
                            },
                            complete: function(res) {
                                resolve({
                                    key: res.key,
                                    url: options.qiniu.domain + '/' + res.key
                                });
                            }
                        };

                        // 使用新版SDK的upload方法
                        const subscription = qiniu.upload(
                                file, fileName, options.qiniu.uploadToken, {}, config
                        );

                        subscription.subscribe(observer);
                    });
                    break;
            }

            // 处理上传结果
            uploadPromise.then(function(res) {
                fileItem.attr('data-url', res.url);
                fileItem.attr('data-key', res.key);
                options.onSuccess(file, res);
                that.updateFileList();
            }).catch(function(err) {
                fileItem.append(`<div class="layui-upload-error">${err.message || '上传失败'}</div>`);
                options.onError(file, err);
            });
        };

        // 生成文件名
        UploadMulti.prototype.generateFileName = function(file) {
            var ext = file.name.split('.').pop();
            var timestamp = new Date().getTime();
            var randomStr = Math.random().toString(36).substr(2, 8);

            return `${timestamp}_${randomStr}.${ext}`;
        };

        // 更新文件列表
        UploadMulti.prototype.updateFileList = function() {
            var files = [];

            this.uploadList.find('.layui-upload-item').each(function() {
                var item = $(this);
                files.push({
                    name: item.attr('data-name'),
                    url: item.attr('data-url'),
                    key: item.attr('data-key')
                });
            });

            this.options.onChange(files);
        };

        // 暴露接口
        exports('uploadMulti', function(options) {
            return new UploadMulti(options);
        });
    });

    // 使用示例
    layui.use(['uploadMulti', 'form'], function() {
